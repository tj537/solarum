[package]
name = "solarum"
version = "0.10.0"
edition = "2021"
# Checked with `cargo +1.96 check --all-targets` (1.95 fails: it can't infer the slice
# types in gen.rs's tables)
rust-version = "1.96"
description = "Techno beats in orbit – a playful drum machine with bass, acid and an auto mode"
license = "MIT"
repository = "https://github.com/tj537/solarum"

[dependencies]
eframe = { version = "0.31", features = ["persistence"] }
egui-phosphor = "0.9"
serde = { version = "1", features = ["derive"] }
cpal = "0.16"
midir = "0.11"
rfd = "0.17"
ron = "0.8"
# Importing your own sounds
symphonia = { version = "0.5", default-features = false, features = ["wav", "aiff", "mp3", "flac", "ogg", "vorbis", "pcm"] }

[dev-dependencies]
png = "0.18"

[build-dependencies]
# App icon and version info in the Windows .exe
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true

# The synth must be fast even in debug builds (cargo run / cargo test)
[profile.dev.package."*"]
opt-level = 2
[profile.dev]
opt-level = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(reel)'] }
